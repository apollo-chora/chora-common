name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
